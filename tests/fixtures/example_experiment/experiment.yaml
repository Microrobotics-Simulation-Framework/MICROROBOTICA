# ─── Schema version ─────────────────────────────────────────────────────────
# Consumer: all (MICROBOTICA C++, MIME runner, SDK, registry)
# Major version change = breaking; minor = additive optional fields
schema_version: "1.0"

# Minimum MIME version required to run this experiment.
# Consumer: MIME runner (checks on startup, refuses if below this)
# Placed at top level because the runner must read it, and the runner
# reads top-level and physics/control/scene sections (not metadata).
mime_version_min: "0.2.0"

# ─── Physics configuration ──────────────────────────────────────────────────
# Consumer: MIME runner (imports setup.py, executes params.py)
physics:
  setup: physics/setup.py
  params: physics/params.py

# ─── Control configuration ──────────────────────────────────────────────────
# Consumer: MIME runner (imports controller.py)
control:
  controller: control/controller.py

# ─── Scene configuration ────────────────────────────────────────────────────
# Consumer: MICROBOTICA C++ (builds actorToPrimPath, loads world.usda)
# Consumer: MIME runner (configures StageBridge)
scene:
  world: scene/world.usda

  actors:
    rigid_body:
      prim_path: /World/Actors/UMR
      prim_type: Capsule
      state_fields: [position, orientation]
    ext_field:
      prim_path: /World/Actors/FieldArrow
      prim_type: Cone
      state_fields: [field_vector]

  environment:
    vessel:
      prim_path: /World/Environment/Vessel
      source: parametric
      geometry: {type: cylinder, radius: 0.0047, length: 0.02, axis: Z}

  analysis:
    flow_field:
      prim_path: /World/Analysis/FlowField
      type: mesh_cross_section
      resolution: [64, 64]

# ─── Cloud configuration (optional) ─────────────────────────────────────────
# Consumer: MICROBOTICA C++ (ExperimentRunner, CloudJobLauncher)
# Consumer: SDK (launch_cloud, sweep)
# Omit entirely for local-only experiments.
cloud:
  job_config: jobs/h100.yaml
  cluster_name: mime-experiment

# ─── Sweep configuration (optional) ─────────────────────────────────────────
# Consumer: SDK only. MICROBOTICA C++ and MIME runner ignore this section.
# v1.0 supports grid (Cartesian product) sweeps only.
# The "strategy" field is reserved for future sweep types (random, Bayesian,
# sequential) — omit or set to "grid" for now.
sweep:
  strategy: grid
  parameters:
    CONFINEMENT_RATIO: [0.15, 0.22, 0.30, 0.40]

# ─── Experiment metadata (optional) ─────────────────────────────────────────
# Consumer: registry, SDK. MICROBOTICA C++ and MIME runner ignore this section.
# Becomes the registry card on upload.
metadata:
  title: "UMR confinement in cylindrical channel"
  description: >
    Characterises step-out frequency as a function of confinement ratio
    for a helical UMR in a cylindrical Poiseuille flow.
  authors:
    - name: "Nick Zot"
      orcid: "0000-0002-XXXX-XXXX"
  license: "CC-BY-4.0"
  tags: ["umr", "confinement", "step-out", "lbm", "poiseuille"]
  doi: null
  benchmarks:
    - benchmark_id: "B1"
      claim: "Step-out frequency within +/-5% of regularised Stokeslet reference"
      result: null

# ─── Derived artifacts (not declared here) ──────────────────────────────────
# graph.json: Generated by MIME runner on first launch as a side-effect of
#   build_graph(). Contains the MADDENING GraphManager topology serialized
#   via GraphManager.to_dict(). Written to the experiment directory root.
#   Purpose: allows MICROBOTICA's graph inspector panel (Phase G) and the
#   SDK to inspect graph topology without starting MIME. Also serves as a
#   static record for reproducibility. Schema determined by MADDENING, not
#   by experiment.yaml.
#
# experiment.json: Generated by scripts/yaml_to_json.py from this file.
#   Consumed by MICROBOTICA C++ (which uses nlohmann_json, not yaml-cpp).
#   Canonical source is this YAML; JSON is a derived build artifact.
