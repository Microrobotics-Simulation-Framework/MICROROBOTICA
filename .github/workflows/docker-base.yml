name: Build & Push Base Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'docker/Dockerfile.base'
      - 'vcpkg.json'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: microrobotics-simulation-framework/microrobotica

jobs:
  build-base:
    name: Build base image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Every build is tagged base-<commit>, which a branch's CI can pin
      # (docker/base-image). Only main moves the shared `base` tag, which
      # main's CI and every developer's container pull.
      - name: Choose tags
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:base-${{ github.sha }}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:base"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.base
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
