name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PXR_ROOT: /opt/usd

jobs:
  # The base image CI builds in: docker/base-image names it, so a branch that
  # changes the image can pin its own build (base-<commit>) while main's CI and
  # everyone else keep the shared `base` until it merges.
  image:
    name: Base image
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.read.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docker/base-image
          sparse-checkout-cone-mode: false
      - id: read
        run: echo "ref=$(tr -d '[:space:]' < docker/base-image)" >> "$GITHUB_OUTPUT"

  build-test:
    name: Build & Test
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Debug)
        run: cmake --preset linux-debug

      - name: Build
        run: cmake --build build/debug

      - name: Build tests
        run: cmake --build build/debug --target microbotica_tests

      - name: Run tests
        run: cd build/debug && ctest --output-on-failure

      # The viewport on an X display (MBCA-VER-020): the OpenGL context Qt makes for the viewport's window through its
      # xcb platform and GLX, and Storm's first frames in it, on Mesa's llvmpipe under Xvfb. The run above skips them:
      # Qt's offscreen platform has no OpenGL. On a desktop: scripts/check-display.sh.
      - name: Viewport on an X display (Xvfb, llvmpipe)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends xvfb xauth > /dev/null
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x1024x24" \
            build/debug/tests/microbotica_gui_tests --reporter console

      # The screenshot tests' pictures, drawn by Storm on Mesa's llvmpipe.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/debug/screenshots/
          if-no-files-found: ignore

      - name: Compliance — check_anomalies.py
        run: python scripts/check_anomalies.py

      - name: Compliance — check_citations.py
        run: python scripts/check_citations.py

      - name: Compliance — harvest_component_meta.py
        run: python scripts/harvest_component_meta.py > /dev/null

  asan-ubsan:
    name: ASan + UBSan
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure (ASan)
        run: cmake --preset linux-asan

      - name: Build tests
        # catch_discover_tests runs the binary at build time to list tests.
        # Must suppress USD/Python shutdown leaks or LSan will fail the discovery.
        # Use $PWD (shell-expanded inside the container) to get the correct path.
        run: LSAN_OPTIONS="suppressions=$PWD/lsan.suppressions" cmake --build build/asan --target microbotica_tests

      - name: Run tests under ASan/UBSan
        run: LSAN_OPTIONS="suppressions=$PWD/lsan.suppressions" ./build/asan/tests/microbotica_tests 
